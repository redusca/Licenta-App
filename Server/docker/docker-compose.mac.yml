# Licenta Server — macOS / Apple Silicon Docker Compose
#
# Build context is the Server/ folder — download only that from GitHub.
#
# Usage (from Server/):
#   docker compose -f docker/docker-compose.mac.yml up --build
#
# Pre-requisites:
#   1. Install Docker Desktop for Mac
#   2. Copy src/.env.example → src/.env and fill in your secrets

version: "3.9"

services:

  # -- PostgreSQL --------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_DB: licenta
      POSTGRES_USER: licenta
      POSTGRES_PASSWORD: licenta
    volumes:
      - postgres_data_mac:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licenta"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -- Licenta Server ----------------------------------------------------------
  server:
    platform: linux/arm64
    build:
      context: ..                          # Server/ folder is all that is needed
      dockerfile: docker/Dockerfile.mac
      cache_from:
        - licenta-server:mac
    restart: unless-stopped
    env_file:
      - ../src/.env
    environment:
      DATABASE_URL: postgresql://licenta:licenta@postgres:5432/licenta
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      # Persist HuggingFace model cache — avoids re-downloading multi-GB weights on every restart
      - hf_cache_mac:/root/.cache/huggingface
    # host.docker.internal resolves automatically on macOS — no extra_hosts needed
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_mac:
    driver: local
  hf_cache_mac:
    driver: local
