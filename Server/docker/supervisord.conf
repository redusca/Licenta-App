[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:server]
command=sh -c "cd /app && python -m alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port %(ENV_PORT)s"
environment=PORT="%(ENV_PORT)s"
autostart=true
autorestart=true
startretries=5
startsecs=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
