# Licenta Server � Production Docker Compose
#
# Usage (from repo root):
#   docker compose -f Server/docker/docker-compose.yml up --build
#
# Pre-requisites:
#   1. Copy Server/src/.env.example ? Server/src/.env and fill in secrets
#   2. Build the React interface: cd Server/Interface && npm install && npm run build
#
# Services: postgres, server

version: "3.9"

services:

  # -- PostgreSQL --------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: licenta
      POSTGRES_USER: licenta
      POSTGRES_PASSWORD: licenta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licenta"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -- Licenta Server ---------------------------------------------------------
  server:
    image: europe-west10-docker.pkg.dev/licenta-ubb/licenta-server/server:latest
    build:
      context: ../..
      dockerfile: Server/docker/Dockerfile
      # Reuse layers from the last pushed image so only changed layers are rebuilt.
      cache_from:
        - europe-west10-docker.pkg.dev/licenta-ubb/licenta-server/server:latest
    restart: unless-stopped
    env_file:
      - ../src/.env           # JWT_SECRET, GOOGLE_API_KEY, GITHUB_TOKEN, etc.
    environment:
      DATABASE_URL: postgresql://licenta:licenta@postgres:5432/licenta
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      # Persist HuggingFace model weights — avoids re-downloading on container restart.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  hf_cache:
    driver: local
